<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>logicgatecalc</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Logic Gate Calculator</h1>
      <p class="subtitle">Enter normal (decimal) numbers, watch conversion to binary, run a gate, then convert back to decimal.</p>

      <section class="controls card">
        <label>A (decimal)
          <input id="inputA" type="number" min="0" max="255" value="25" />
        </label>
        <label>B (decimal)
          <input id="inputB" type="number" min="0" max="255" value="14" />
        </label>
        <label>Gate
          <select id="gate">
            <option value="AND">AND</option>
            <option value="OR">OR</option>
            <option value="XOR" selected>XOR</option>
            <option value="NAND">NAND</option>
            <option value="NOR">NOR</option>
            <option value="XNOR">XNOR</option>
          </select>
        </label>
        <button id="run">Animate Calculation</button>
      </section>

      <section class="visual card" id="visual">
        <div class="stage" id="stageLabel">Stage: Ready</div>
        <div class="row"><span>A Binary</span><code id="binA">00011001</code></div>
        <div class="row"><span>B Binary</span><code id="binB">00001110</code></div>

        <div class="circuit" aria-hidden="true">
          <div class="wire a"></div>
          <div class="wire b"></div>
          <div class="gate" id="gateNode">XOR</div>
          <div class="wire out"></div>
        </div>

        <table class="bit-table">
          <thead>
            <tr><th>Bit</th><th>A</th><th>B</th><th>Gate</th><th>Out</th></tr>
          </thead>
          <tbody id="bitRows"></tbody>
        </table>

        <div class="row result-row"><span>Result Binary</span><code id="binR">00010111</code></div>
        <div class="row result-row"><span>Result Decimal</span><strong id="decR">23</strong></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
